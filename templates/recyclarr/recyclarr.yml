# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Root: instance URLs/keys + include list. Profile packs are under includes/.
# All packs listed here are synced; Seerr's default is chosen at setup.
# See README "Quality Profiles & TRaSH Guides".

radarr:
  radarr-instance:
    base_url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    # No quality_definition → no min/max size filters from Recyclarr.
    include:
      - config: radarr-hd.yml
      - config: radarr-uhd.yml
      - config: radarr-soft-cfs.yml

sonarr:
  sonarr-instance:
    base_url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}
    include:
      - config: sonarr-web-1080.yml
      - config: sonarr-web-2160.yml
      - config: sonarr-soft-cfs.yml
