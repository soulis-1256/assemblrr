# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Root: instance URLs/keys + include list. Profile packs are under includes/.
# All packs listed here are synced; the default (movies + TV) is chosen at setup.
# Movie WEB packs are Recyclarr variants of the HD/UHD Bluray + WEB trash IDs.
# See docs/trash-guides.md.

radarr:
  radarr-instance:
    base_url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    # No quality_definition → no min/max size filters from Recyclarr.
    include:
      - config: radarr-1080p-bluray.yml
      - config: radarr-4k-bluray.yml
      - config: radarr-1080p-web.yml
      - config: radarr-4k-web.yml
      - config: radarr-soft-cfs.yml

sonarr:
  sonarr-instance:
    base_url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}
    include:
      - config: sonarr-1080p-web.yml
      - config: sonarr-4k-web.yml
      - config: sonarr-soft-cfs.yml
