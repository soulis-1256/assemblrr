# Overlay: SABnzbd Usenet downloader (wired automatically into Sonarr/Radarr/Prowlarr)
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ${INSTALL_DIRECTORY}/config/sabnzbd:/config
    ports:
      - 8085:8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api?mode=version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    networks:
      assemblrr_network:
        ipv4_address: 172.60.0.25
